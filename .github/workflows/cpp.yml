# Builds the C++ / raylib prototype in cpp/ and runs its rule tests on
# Windows (MSVC) and macOS (Apple Clang). Only runs when cpp/ or this file
# changes, so the Next.js app is not affected.

name: C++ prototype

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see both platforms' results even if one fails
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # raylib is downloaded by CMake (FetchContent); keep the download
      # between runs.
      - uses: actions/cache@v4
        with:
          path: cpp/build/_deps/raylib-subbuild/raylib-populate-prefix/src
          key: raylib-6.0-${{ runner.os }}

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build (game and tests)
        run: cmake --build cpp/build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir cpp/build -C Release --output-on-failure
